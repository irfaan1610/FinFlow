<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinFlow — Register</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">

  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <i class="fa-solid fa-chart-line"></i>
      </div>
      <span class="auth-logo-name">FinFlow</span>
    </div>

    <!-- Heading -->
    <h1 class="auth-heading">Create account</h1>
    <p class="auth-subheading">Start tracking your finances today</p>

    <!-- Register Form — IDs untouched for auth.js -->
    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label" for="name">
          <i class="fa-solid fa-user me-1" style="color:var(--text-3)"></i> Full name
        </label>
        <input
          id="name"
          type="text"
          class="form-control"
          placeholder="Enter your name"
          required
          autocomplete="name"
        />
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">
          <i class="fa-solid fa-envelope me-1" style="color:var(--text-3)"></i> Email address
        </label>
        <input
          id="email"
          type="email"
          class="form-control"
          placeholder="Enter your email"
          required
          autocomplete="email"
        />
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">
          <i class="fa-solid fa-lock me-1" style="color:var(--text-3)"></i> Password
        </label>
        <div style="position:relative;">
          <input
            id="password"
            type="password"
            class="form-control"
            placeholder="Min 8 characters"
            required
            autocomplete="new-password"
            style="padding-right: 44px !important;"
          />
          <button
            type="button"
            onclick="togglePassword('password', this)"
            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-3);cursor:pointer;padding:0;"
          >
            <i class="fa-solid fa-eye" style="font-size:14px;"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" style="padding:12px;">
        <i class="fa-solid fa-user-plus"></i>
        Create Account
      </button>
    </form>

    <p class="auth-footer-text">
      Already have an account? <a href="index.html">Sign in</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon  = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }
  </script>
</body>
</html>
